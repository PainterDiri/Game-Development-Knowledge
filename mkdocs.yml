site_name: 游戏开发究极知识包
site_url: https://painterdiri.github.io/Game-Development-Knowledge/
site_description: 以计算机科学培养方案为基础、面向 Unity/Unreal Engine 与肉鸽游戏开发的系统知识库
repo_name: PainterDiri/Game-Development-Knowledge
repo_url: https://github.com/PainterDiri/Game-Development-Knowledge
edit_uri: edit/main/

theme:
  name: material
  language: zh
  icon:
    logo: material/controller-classic
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  font: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_javascript:
  - javascripts/learning-progress.js
  - javascripts/learning-ui.js

extra_css:
  - stylesheets/learning-progress.css
  - stylesheets/site.css

not_in_nav: |
  /roadmap/README.md
  /roadmap/course-index.md

nav:
  - 首页: index.md
  - 课程:
      - 课程总览: course-index.md
      - 阶段 0 · 工具链:
          - 工具链与 Git:
              - 课程与地图: courses/toolchain-and-git/README.md
              - 1 · 程序、终端与项目: courses/toolchain-and-git/lessons/01-computer-terminal-and-project.md
              - 2 · Git 日常基础: courses/toolchain-and-git/lessons/02-git-daily-workflow.md
              - 3 · 分支、远端与同步: courses/toolchain-and-git/lessons/03-branches-remotes-and-sync.md
              - 4 · 合并、冲突与恢复: courses/toolchain-and-git/lessons/04-integration-conflicts-and-recovery.md
              - 5 · 专业团队工作流: courses/toolchain-and-git/lessons/05-professional-team-workflow.md
              - 6 · 构建系统的边界: courses/toolchain-and-git/lessons/06-build-system-model.md
              - 7 · 可复现性与环境: courses/toolchain-and-git/lessons/07-reproducibility-and-environment.md
              - 8 · 测试、构建与诊断: courses/toolchain-and-git/lessons/08-testing-building-and-diagnosis.md
              - 9 · CI、发布与回滚: courses/toolchain-and-git/lessons/09-ci-release-and-rollback.md
              - 主实践: courses/toolchain-and-git/practice.md
              - 主项目接缝: courses/toolchain-and-git/integration-contract.md
              - 练习题: courses/toolchain-and-git/assessments.md
              - 参考书目: courses/toolchain-and-git/references/bibliography.md
              - 研究笔记: courses/toolchain-and-git/references/research-notes.md
      - 阶段 1 · 编程与数学:
          - C 程序设计:
              - 课程与地图: courses/c-programming/README.md
              - 1 · 从源文件到进程: courses/c-programming/lessons/01-running-c-program.md
              - 2 · 对象、类型与状态: courses/c-programming/lessons/02-objects-types-and-state.md
              - 3 · 表达式、转换与数值边界: courses/c-programming/lessons/03-expressions-conversions-and-numeric-bounds.md
              - 4 · 分支、循环与不变量: courses/c-programming/lessons/04-control-flow-and-loop-invariants.md
              - 5 · 函数、作用域与调用栈: courses/c-programming/lessons/05-functions-scope-and-call-stack.md
              - 6 · 头文件、链接与模块: courses/c-programming/lessons/06-headers-linkage-and-modules.md
              - 7 · 数组与连续内存: courses/c-programming/lessons/07-arrays-and-contiguous-memory.md
              - 8 · 字符串、字节与缓冲区: courses/c-programming/lessons/08-strings-bytes-and-buffer-boundaries.md
              - 9 · 指针、const 与别名: courses/c-programming/lessons/09-pointers-const-and-aliasing.md
              - 10 · 指针参数与区间 API: courses/c-programming/lessons/10-pointer-parameters-and-range-apis.md
              - 11 · 动态内存与所有权: courses/c-programming/lessons/11-dynamic-memory-and-ownership.md
              - 12 · 结构体、布局与对齐: courses/c-programming/lessons/12-struct-layout-alignment-and-serialization.md
              - 13 · 枚举、联合与位标志: courses/c-programming/lessons/13-enums-unions-and-bitflags.md
              - 14 · 文件 I/O 与错误处理: courses/c-programming/lessons/14-file-io-and-error-handling.md
              - 15 · UB、Sanitizer 与调试: courses/c-programming/lessons/15-undefined-behavior-sanitizers-and-debugging.md
              - 16 · 测试、不变量与基准: courses/c-programming/lessons/16-tests-invariants-and-benchmarks.md
              - 17 · 运行时组件库: courses/c-programming/lessons/17-runtime-component-library.md
              - 18 · C ABI 与引擎适配: courses/c-programming/lessons/18-c-abi-and-engine-adapters.md
              - 主实践: courses/c-programming/practice.md
              - 主项目接缝: courses/c-programming/integration-contract.md
              - 练习题: courses/c-programming/assessments.md
              - 参考书目: courses/c-programming/references/bibliography.md
              - 研究笔记: courses/c-programming/references/research-notes.md
              - 参考代码: courses/c-programming/code/runtime-kit/README.md
          - 离散数学: courses/discrete-mathematics/README.md
          - 游戏线性代数: courses/linear-algebra-for-games/README.md
          - 微积分与概率: courses/calculus-and-probability/README.md
      - 阶段 2 · 算法与程序设计:
          - 数据结构: courses/data-structures/README.md
